[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kyle-trek"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["ursina"]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["src", "tests"]
